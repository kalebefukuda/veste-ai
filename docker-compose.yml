services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vesteai
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: vesteai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vesteai"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_URL: postgresql+psycopg://vesteai:dev@db:5432/vesteai
      FRONTEND_ORIGIN: http://localhost:3000
      JWT_SECRET: dev-only-secret
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
