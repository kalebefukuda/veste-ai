name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

# Cancels superseded PR runs only; a push run on dev or main always finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend — lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Postgres de verdade: SQLite mentiria sobre UUID e ON DELETE CASCADE.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vesteai
          POSTGRES_PASSWORD: vesteai
          POSTGRES_DB: vesteai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://vesteai:vesteai@localhost:5432/vesteai_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          # Both files, or a change to requirements.txt alone would reuse a stale cache.
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # A ratchet against regression, not the target — raised each sprint, never lowered.
      - name: Tests
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=90

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  frontend:
    name: frontend — lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # In maintenance until Apr/2027, covering delivery and the grading period.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:coverage

      # `next build` type-checks, standing in for the typecheck script the app lacks.
      - name: Build
        run: npm run build

  infra:
    name: infra — format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.8"

      - name: Format
        run: terraform fmt -check -recursive

      # `plan` precisa de credencial e fica fora do CI; `apply` é sempre manual.
      - name: Init and validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

  sonarcloud:
    name: sonarcloud — static analysis
    runs-on: ubuntu-latest
    needs: [backend]
    # Job-level env is the only place a secret is readable by a step-level `if`.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
      IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
    steps:
      # Forks never receive secrets, so a missing token there is expected, not a fault.
      - name: Require a token outside forks
        if: env.SONAR_TOKEN == ''
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo "Fork pull request — SONAR_TOKEN is unavailable, analysis skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::SONAR_TOKEN is not configured and static analysis is required."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.SONAR_TOKEN != ''
        with:
          # Full history, so SonarCloud can blame issues and compute the new-code period.
          fetch-depth: 0

      - name: Download coverage report
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-coverage
          path: backend

      - name: Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
