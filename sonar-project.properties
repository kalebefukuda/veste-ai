sonar.projectKey=kalebefukuda_veste-ai
sonar.organization=kalebefukuda

sonar.sourceEncoding=UTF-8

# `backend/app`, not `backend`, keeps generated alembic migrations out of the analysis.
sonar.sources=backend/app,frontend
sonar.tests=backend/tests,frontend/__tests__

# Fora das fontes porque `sonar.sources` inclui `frontend` inteiro; eles seguem
# declarados em `sonar.tests`, e fonte e teste precisam ser conjuntos disjuntos.
sonar.exclusions=frontend/node_modules/**,frontend/.next/**,frontend/package-lock.json,frontend/__tests__/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Mirrors the `omit` list in backend/pyproject.toml.
sonar.coverage.exclusions=backend/app/config.py,backend/app/**/__init__.py
