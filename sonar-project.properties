sonar.projectKey=kalebefukuda_veste-ai
sonar.organization=kalebefukuda

sonar.sourceEncoding=UTF-8

# `backend/app` em vez de `backend` mantém alembic fora da análise: migration é
# gerada, e medir dívida técnica nela só produz ruído.
sonar.sources=backend/app,frontend
sonar.tests=backend/tests

sonar.exclusions=frontend/node_modules/**,frontend/.next/**,frontend/package-lock.json

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml

# Espelha o `omit` de [tool.coverage.run] em backend/pyproject.toml. Exclusão
# declarada é técnica; exclusão escondida é maquiagem de percentual.
sonar.coverage.exclusions=backend/app/config.py,backend/app/**/__init__.py
